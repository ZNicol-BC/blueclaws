# Netlify settings for BlueClaws IQ.
# This tells Netlify how to build and serve the site.

[build]
  publish = "."                 # serve the repo root (index.html lives here)
  functions = "netlify/functions"
  command = "npm install"       # just install dependencies; nothing else needed.
  # (Promoting the newest index*.html to index.html is handled by GitHub Actions —
  #  see .github/workflows/promote-index.yml — so it does NOT run here too.)

# Keep behind-the-scenes files from being opened by the public.
# Because publish = "." serves the whole repo, without these anyone could open
# yoursite/motion-audits/... or the raw promote-index.sh.
[[redirects]]
  from = "/motion-audits/*"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/promote-index.sh"
  to = "/404.html"
  status = 404
