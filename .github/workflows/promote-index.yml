name: Promote Latest Index File
# Runs whenever you push a new index*.html file at repo root
on:
  push:
    branches: [main]
    paths:
      - 'index*.html'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote latest index file
        run: bash promote-index.sh --clean

      - name: Commit and push
        if: env.PROMOTED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: promote latest index file [skip actions]"
          git push
